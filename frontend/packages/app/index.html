<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{app_name}}</title>
  <script>
    // Apply saved theme before first paint to avoid flash between light/dark.
    (function () {
      try {
        var stored = localStorage.getItem("next-pms-ui-theme");
        var theme = stored || "system";
        if (theme === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(theme === "dark" ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script>
    // Load everything from the page context to window object
    // This will allow us to access frappe boot in our react app.
    window.csrf_token = '{{ csrf_token }}';
    if (!window.frappe) window.frappe = {};

    window.app_name = "{{ app_name }}";

    frappe.boot = JSON.parse({{ boot }});
    frappe.csrf_token = "{{ csrf_token }}";
  </script>
  <script type="module" src="./src/main.tsx"></script>
</body>

</html>
